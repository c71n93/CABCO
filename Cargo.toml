[package]
name = "cabco"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
description = "Classify committed changes by component ownership"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.20"
